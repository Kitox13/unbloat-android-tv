name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openjdk-17-jdk aapt android-sdk-platform-23 dalvik-exchange apksigner zipalign
      - run: bash ecran-accueil/source/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ZenHome
          path: ecran-accueil/source/out/ZenHome.apk
